name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Xcode 26 is needed: the deck uses macOS 26 APIs (behind availability checks).
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Build
        run: swift build --build-tests
      # `swift build` copies Localizable.xcstrings into the resource bundle without compiling it.
      - name: Compile strings
        run: scripts/compile_strings.sh "$(swift build --show-bin-path)/VibeCheck_VibeCheck.bundle"
      - name: Test
        run: swift test --skip-build
      - name: Smoke-test CLI and shell scripts
        run: |
          BIN="$(swift build --show-bin-path)/VibeCheckCLI"
          "$BIN" --help >/dev/null
          "$BIN" --version | grep -q '^vibecheck '
          bash -n build.sh scripts/*.sh

  raycast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/raycast/package-lock.json
      - name: Typecheck Raycast integration
        working-directory: integrations/raycast
        run: npm ci && npx tsc --noEmit
