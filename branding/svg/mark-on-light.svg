<svg xmlns="http://www.w3.org/2000/svg" viewBox="196 196 632 632" width="632" height="632">
  <!-- VibeCheck mark, "Mood Dial": the vibe ring is the dial track, the knob's notch points at the gap,
       and the check sits in the gap. Same ring geometry as the app icon. -->
  <defs>
    <linearGradient id="ring" x1="0.1" y1="0.15" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#3DE0B5"/>
      <stop offset="0.5" stop-color="#36B6F2"/>
      <stop offset="1" stop-color="#8B6CFF"/>
    </linearGradient>
    <mask id="notch" maskUnits="userSpaceOnUse" x="196" y="196" width="632" height="632">
      <rect x="196" y="196" width="632" height="632" fill="#FFFFFF"/>
      <path d="M545 479 L660 364" fill="none" stroke="#000000" stroke-width="36" stroke-linecap="round"/>
    </mask>
  </defs>
  <circle cx="512" cy="512" r="268" fill="none" stroke="url(#ring)" stroke-width="72" stroke-linecap="round" stroke-dasharray="1450.0 233.9" transform="rotate(-20 512 512)"/>
  <circle cx="512" cy="512" r="152" fill="#141833" mask="url(#notch)"/>
  <path d="M652 320 L688 356 L754 286" fill="none" stroke="#141833" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
